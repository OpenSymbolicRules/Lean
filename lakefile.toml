name = "OSR"
version = "0.1.0"
defaultTargets = ["OSR"]
testDriver = "OSRTest"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "OSR"

[[lean_lib]]
name = "OSRTest"
globs = ["OSRTest.+"]
